<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANAD 33 | Luxury Accessories - Khartoum Bahri</title>
    
    <!-- خطوط فاخرة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F4E4BC;
            --gold-dark: #AA8C2C;
            --black: #050505;
            --black-light: #0a0a0a;
            --black-card: #111111;
            --white: #ffffff;
            --gray: #888888;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--black);
            color: var(--white);
            overflow-x: hidden;
            cursor: none;
        }

        /* مؤشر فأرة مخصص */
        .cursor {
            width: 20px;
            height: 20px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.2s, background 0.2s;
            mix-blend-mode: difference;
        }

        .cursor-follower {
            width: 40px;
            height: 40px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.4s ease;
        }

        body:hover .cursor {
            transform: scale(1.5);
            background: var(--gold);
        }

        /* شاشة التحميل */
        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--black);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s, visibility 0.8s;
        }

        .loader-text {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            color: var(--gold);
            letter-spacing: 10px;
            margin-bottom: 30px;
            animation: fadeInOut 2s infinite;
        }

        .loader-bar {
            width: 200px;
            height: 2px;
            background: #222;
            position: relative;
            overflow: hidden;
        }

        .loader-progress {
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            background: var(--gold);
            animation: loading 2s ease-in-out infinite;
        }

        @keyframes loading {
            0% { width: 0; left: 0; }
            50% { width: 100%; left: 0; }
            100% { width: 0; left: 100%; }
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* خلفية متحركة */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.03) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* الهيدر */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 25px 60px;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.4s;
        }

        .logo-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-icon {
            width: 50px;
            height: 50px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            color: var(--gold);
            font-size: 1.2rem;
            position: relative;
            overflow: hidden;
        }

        .logo-icon::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: conic-gradient(transparent, var(--gold), transparent);
            animation: rotate 4s linear infinite;
            opacity: 0.3;
        }

        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .logo-text {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
        }

        .logo-sub {
            font-size: 0.8rem;
            color: var(--gray);
            letter-spacing: 2px;
            margin-top: -5px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 40px;
        }

        nav a {
            color: var(--white);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            padding: 10px 0;
            font-weight: 300;
            transition: 0.4s;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 0;
            height: 1px;
            background: var(--gold);
            transition: width 0.4s;
        }

        nav a:hover {
            color: var(--gold);
        }

        nav a:hover::after {
            width: 100%;
        }

        /* القسم الرئيسي البطولي */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3), var(--black)),
                        url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080"><rect fill="%23050505" width="1920" height="1080"/><path fill="%23111" d="M0 540 Q 480 440 960 540 T 1920 540 L 1920 1080 L 0 1080 Z"/></svg>');
            background-size: cover;
            background-position: center;
        }

        .hero-content {
            z-index: 2;
            max-width: 900px;
            padding: 0 20px;
        }

        .hero-tag {
            font-size: 0.9rem;
            letter-spacing: 8px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeInUp 1s 0.5s forwards;
        }

        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.2;
            background: linear-gradient(180deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: fadeInUp 1s 0.8s forwards;
        }

        .hero-subtitle {
            font-size: 1.8rem;
            color: var(--white);
            margin-bottom: 20px;
            font-weight: 300;
            opacity: 0;
            animation: fadeInUp 1s 1s forwards;
        }

        .hero-location {
            font-size: 1.2rem;
            color: var(--gold);
            letter-spacing: 3px;
            margin-bottom: 50px;
            opacity: 0;
            animation: fadeInUp 1s 1.2s forwards;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
            from {
                opacity: 0;
                transform: translateY(30px);
            }
        }

        .cta-button {
            display: inline-block;
            padding: 20px 50px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            font-size: 1rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: 0.5s;
            opacity: 0;
            animation: fadeInUp 1s 1.4s forwards;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            transition: 0.5s;
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:hover {
            background: var(--gold);
            color: var(--black);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
        }

        /* خط زخرفي */
        .ornament {
            width: 1px;
            height: 100px;
            background: linear-gradient(to bottom, transparent, var(--gold), transparent);
            margin: 50px auto;
            position: relative;
        }

        .ornament::before {
            content: '◆';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--gold);
            font-size: 1.5rem;
            background: var(--black);
            padding: 10px;
        }

        /* قسم الإحصائيات */
        .stats {
            display: flex;
            justify-content: center;
            gap: 100px;
            padding: 100px 20px;
            background: linear-gradient(to bottom, transparent, rgba(212, 175, 55, 0.03), transparent);
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 700;
            color: var(--gold);
            line-height: 1;
        }

        .stat-label {
            font-size: 1rem;
            color: var(--gray);
            letter-spacing: 3px;
            margin-top: 10px;
            text-transform: uppercase;
        }

        /* المعرض الفاخر */
        .gallery-section {
            padding: 150px 60px;
            position: relative;
        }

        .section-header {
            text-align: center;
            margin-bottom: 100px;
        }

        .section-tag {
            font-size: 0.9rem;
            letter-spacing: 8px;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: 20px;
            display: block;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 3.5rem;
            color: var(--white);
            margin-bottom: 20px;
            font-weight: 400;
        }

        .section-desc {
            color: var(--gray);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.8;
        }

        /* شبكة المنتجات الفاخرة */
        .luxury-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 40px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .luxury-card {
            background: var(--black-card);
            border: 1px solid rgba(212, 175, 55, 0.1);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .luxury-card:hover {
            transform: translateY(-15px);
            border-color: var(--gold);
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.8),
                0 0 40px rgba(212, 175, 55, 0.1);
        }

        .card-image-wrapper {
            position: relative;
            height: 450px;
            overflow: hidden;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1s;
        }

        .luxury-card:hover .card-image {
            transform: scale(1.1);
        }

        .card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.3) 50%, transparent 100%);
            display: flex;
            align-items: flex-end;
            padding: 40px;
            opacity: 0;
            transition: opacity 0.6s;
        }

        .luxury-card:hover .card-overlay {
            opacity: 1;
        }

        .card-number {
            position: absolute;
            top: 30px;
            right: 30px;
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 700;
            color: transparent;
            -webkit-text-stroke: 1px rgba(212, 175, 55, 0.3);
            z-index: 3;
            line-height: 1;
        }

        .card-content {
            position: relative;
            z-index: 4;
            width: 100%;
            transform: translateY(20px);
            transition: transform 0.6s;
        }

        .luxury-card:hover .card-content {
            transform: translateY(0);
        }

        .card-title {
            font-size: 1.8rem;
            color: var(--gold-light);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .card-desc {
            color: var(--gray);
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .card-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 30px;
            background: transparent;
            border: 1px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            font-size: 0.9rem;
            letter-spacing: 2px;
            transition: all 0.3s;
        }

        .card-btn:hover {
            background: var(--gold);
            color: var(--black);
        }

        .card-info {
            padding: 30px;
            background: var(--black-card);
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--gray);
            font-size: 0.9rem;
        }

        .card-price {
            color: var(--gold);
            font-size: 1.3rem;
            font-weight: 700;
        }

        /* تأثير الضوء المتحرك */
        .shine {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(212, 175, 55, 0.1) 50%, transparent 60%);
            transform: rotate(30deg);
            transition: 0.6s;
            pointer-events: none;
        }

        .luxury-card:hover .shine {
            left: 100%;
            transition: 1s;
        }

        /* قسم التواصل */
        .contact-section {
            padding: 150px 60px;
            background: linear-gradient(to top, rgba(212, 175, 55, 0.05), transparent);
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.1);
        }

        .contact-box {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 30px;
            background: rgba(17, 17, 17, 0.8);
            backdrop-filter: blur(10px);
        }

        .contact-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 30px;
        }

        .contact-info {
            font-size: 1.3rem;
            color: var(--white);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .contact-info span {
            color: var(--gold);
            font-weight: 700;
        }

        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-top: 40px;
            padding: 20px 50px;
            background: #25D366;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: 700;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(37, 211, 102, 0.4);
        }

        /* الفوتر */
        footer {
            background: var(--black);
            padding: 60px;
            text-align: center;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .footer-logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--gold);
            margin-bottom: 20px;
        }

        .footer-text {
            color: var(--gray);
            font-size: 0.9rem;
            letter-spacing: 2px;
        }

        .footer-line {
            width: 100px;
            height: 1px;
            background: var(--gold);
            margin: 30px auto;
        }

        /* زر الواتساب العائم */
        .float-whatsapp {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: #25D366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 2rem;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(37, 211, 102, 0.4);
            z-index: 999;
            transition: transform 0.3s;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            50% { box-shadow: 0 0 0 20px rgba(37, 211, 102, 0); }
        }

        .float-whatsapp:hover {
            transform: scale(1.1);
        }

        /* للموبايل */
        @media (max-width: 768px) {
            .hero-title { font-size: 2.5rem; }
            .luxury-grid { grid-template-columns: 1fr; }
            .stats { flex-direction: column; gap: 50px; }
            header { padding: 20px; }
            nav { display: none; }
            .gallery-section { padding: 80px 20px; }
