<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المتجر - سند للأكسسوارات</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- الهيدر -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <button class="menu-btn" onclick="toggleMenu()">
                    <i class="fas fa-bars"></i>
                </button>
                
                <div class="logo-section">
                    <div class="logo-icon">س</div>
                    <div class="logo-text">
                        <h1>سند للأكسسوارات</h1>
                        <p>الخرطوم بحري - حي السودان | طلب واتساب مباشر</p>
                    </div>
                </div>
                
                <button class="order-btn" onclick="openWhatsApp()">
                    اطلب الآن
                </button>
                
                <div class="cart-icon" onclick="toggleCart()">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </div>
    </header>

    <!-- القائمة الجانبية -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>القائمة</h3>
            <button class="close-btn" onclick="toggleMenu()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-home"></i> الرئيسية</a></li>
            <li><a href="sind-store.html"><i class="fas fa-store"></i> المتجر</a></li>
            <li><a href="#products"><i class="fas fa-box"></i> المنتجات</a></li>
            <li><a href="#contact"><i class="fas fa-phone"></i> تواصل معنا</a></li>
        </ul>
    </nav>

    <!-- المحتوى الرئيسي -->
    <main class="main-content store-page">
        <div class="container">
            <!-- عنوان الصفحة -->
            <div class="page-header">
                <h2 class="page-title">المنتجات</h2>
                <div class="products-count">
                    <span id="productsCount">16</span> منتج
                </div>
            </div>

            <!-- شريط البحث والتصفية -->
            <div class="filter-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="ابحث باسم الملف..." onkeyup="searchProducts()">
                </div>
                
                <div class="sort-box">
                    <select id="sortSelect" onchange="sortProducts()">
                        <option value="name">الاسم (أ-ي)</option>
                        <option value="price-low">السعر: من الأقل للأعلى</option>
                        <option value="price-high">السعر: من الأعلى للأقل</option>
                        <option value="newest">الأحدث</option>
                    </select>
                    <i class="fas fa-chevron-down"></i>
                </div>
            </div>

            <!-- أزرار التصفية -->
            <div class="filter-tabs">
                <button class="filter-btn active" onclick="filterProducts('all')">
                    الكل
                </button>
                <button class="filter-btn" onclick="filterProducts('mafsal')">
                    مفصلات
                </button>
                <button class="filter-btn" onclick="filterProducts('masak')">
                    مقابض
                </button>
                <button class="filter-btn" onclick="filterProducts('lock')">
                    أقفال
                </button>
                <button class="filter-btn" onclick="filterProducts('other')">
                    أخرى
                </button>
                <button class="filter-btn favorite" onclick="filterProducts('favorite')">
                    <i class="fas fa-star"></i> المفضلة
                </button>
            </div>

            <!-- شبكة المنتجات -->
            <div class="products-grid" id="productsGrid">
                <!-- سيتم ملؤها بالJavaScript -->
            </div>

            <!-- ترقيم الصفحات -->
            <div class="pagination">
                <span class="page-info">صفحة <span id="currentPage">1</span> من <span id="totalPages">2</span></span>
                <div class="page-buttons">
                    <button class="page-btn" onclick="changePage(-1)">
                        <i class="fas fa-chevron-right"></i>
                    </button>
                    <button class="page-btn active">1</button>
                    <button class="page-btn" onclick="changePage(1)">
                        <i class="fas fa-chevron-left"></i>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="footer">
        <div class="container">
            <p>© 2025 سند للأكسسوارات - جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <!-- زر واتساب العائم -->
    <a href="https://wa.me/249913678918" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script src="script.js"></script>
</body>
</html>
